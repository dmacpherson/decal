  <ellipse cx="320" cy="446" rx="64" ry="26" transform="rotate(6 320 446)" fill="url(#holo)" stroke="url(#holo)" stroke-width="40" stroke-linejoin="round"/></g>
    
  <ellipse cx="150" cy="300" rx="34" ry="92" transform="rotate(22 150 300)" fill="#191826"/>
