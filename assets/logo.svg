    <clipPath id="keep"><path d="M -1288.5182257425497 1858.8756366162715 L 1718.5182257425497 -778.8756366162715 L -2000 -2000 Z"/></clipPath>
    <clipPath id="cut"><path d="M -1288.5182257425497 1858.8756366162715 L 1718.5182257425497 -778.8756366162715 L 2000 2000 Z"/></clipPath>
  </defs>
  <g clip-path="url(#keep)">
