# Push a tag like v1.2.0 -> a GitHub release with decal.tar.gz and its checksum (what install.sh downloads), built by
# build.yml (the USB stick launchers inside). A tag with a "-" (v1.2.0-rc1) is a pre-release: never "latest".
# Run the checks first, on dev before tools/promote.sh (bash tests/run.sh, shellcheck, gitleaks); this only packages.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=(); if [[ $GITHUB_REF_NAME == *-* ]]; then pre=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/decal.tar.gz dist/decal.tar.gz.sha256 --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes "${pre[@]}"
