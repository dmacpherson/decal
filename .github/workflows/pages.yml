# The installers at short URLs: https://dmacpherson.github.io/decal/install (stable, from main) and /dev/install (the
# dev branch's, defaulting to the dev channel). Runs on main only (GitHub Pages deploys from the default branch):
# when main's installer changes, and when dev.yml asks after each dev build.
name: pages
on:
  push:
    branches: [main]
    paths: [install.sh, tools/pages-site.sh, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Site
        run: |
          git show origin/dev:install.sh > dev-install.sh 2>/dev/null || cp install.sh dev-install.sh   # no dev branch yet: main's
          bash tools/pages-site.sh install.sh dev-install.sh _site "$GITHUB_REPOSITORY"
      - uses: actions/upload-pages-artifact@v5
      - id: deploy
        uses: actions/deploy-pages@v5
