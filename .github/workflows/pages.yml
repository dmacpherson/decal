# The installer at a short URL: https://dmacpherson.github.io/decal/install (and /install.sh)
name: pages
on:
  push:
    branches: [main]
    paths: [install.sh, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Site
        run: |
          mkdir _site
          cp install.sh _site/install; cp install.sh _site/install.sh
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=https://github.com/%s"><title>decal</title><a href="https://github.com/%s">decal</a>\n' "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" > _site/index.html
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4
